# [INPUT]: Reads the public release API through sync-release.mjs using this repository's token.
# [OUTPUT]: Commits a verified lib/release.json snapshot on schedule or manual dispatch.
# [POS]: Website-owned download synchronization, independent of desktop release automation.
# [PROTOCOL]: Update this header when making changes, then check README.md.

name: sync-release

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0

      # Prereleases and partial platform releases are intentional. Every
      # advertised installer must be unique, uploaded, and downloadable.
      - run: node scripts/sync-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit the new snapshot
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/release.json; then
            echo "already current"
            exit 0
          fi
          version=$(node -p 'require("./lib/release.json").version')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: point downloads at v${version}" -- lib/release.json
          git push
